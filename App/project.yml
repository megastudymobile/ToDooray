# XcodeGen spec for the .app bundle. `make app` generates App/ToDooray.xcodeproj and
# App/Info.plist from this file. Both are git-ignored. All code lives in the root package,
# and the app target is the one file in Shell/.
name: ToDooray
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ToDoorayPackage:
    path: ..
targets:
  ToDooray:
    type: application
    platform: macOS
    sources:
      - path: Shell/main.swift
      - path: Shell/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ToDoorayPackage
        product: ToDoorayApp
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ToDooray
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSAppTransportSecurity:
          # Plain http stays limited to loopback addresses, which the mock server uses.
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Teammates' Keychain item, login item and UserDefaults are keyed on this id, so
        # changing it after a release makes everyone set the app up again.
        TODOORAY_BUNDLE_ID: com.megastudymobile.ToDooray
        PRODUCT_BUNDLE_IDENTIFIER: $(TODOORAY_BUNDLE_ID)$(TODOORAY_BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: ToDooray
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          # A Debug build keeps its own Keychain item, defaults and login item, apart from
          # an installed Release build.
          TODOORAY_BUNDLE_ID_SUFFIX: .debug
schemes:
  ToDooray:
    build:
      targets:
        ToDooray: all
    run:
      config: Debug
    archive:
      config: Release
